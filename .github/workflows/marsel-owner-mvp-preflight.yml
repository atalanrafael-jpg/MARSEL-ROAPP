name: MARSEL ROAPP Owner MVP Preflight

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "01_MASTER/**"
      - "README.md"
      - "05_MARSEL_CURRENT_STATE.md"
      - "docs/**"
      - "scripts/marsel_owner_mvp_preflight.py"
      - ".github/workflows/marsel-owner-mvp-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Owner MVP static preflight
        run: python scripts/marsel_owner_mvp_preflight.py

      - name: Run tests when present
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            python -m pip install -r requirements.txt
            python -m pytest -q
          else
            echo "No pytest suite found; static preflight remains authoritative for this workflow."
          fi
