name: MARSEL Unified Control Plane

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: marsel-unified-control-plane-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# PRODUCTION_WRITE=DISABLED; this workflow is READ-ONLY and must never mutate RO App production data.

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input "httpx==0.28.1"
      - name: Verify canonical structure
        run: python scripts/marsel_canonical_self_check.py
      - name: Verify canonical control plane
        run: python scripts/marsel_control_plane_validate.py
      - name: Verify RO App secret
        if: github.event_name != 'pull_request'
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        shell: bash
        run: test -n "$ROAPP_API_KEY"
      - name: Canonical READ-ONLY API inventory
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_API_INVENTORY_OUTPUT: marsel-unified-api-inventory.json
          MARSEL_MAX_DOCS: "300"
          MARSEL_INVENTORY_BUDGET_SECONDS: "300"
          MARSEL_MAX_PAGES: "10000"
          ROAPP_TIMEOUT: "30"
          ROAPP_MAX_RETRIES: "2"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_api_inventory_v20_32.py
      - name: Canonical READ-ONLY data quality
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_DATA_QUALITY_OUTPUT: marsel-unified-data-quality.json
          MARSEL_MAX_PAGES: "10000"
          ROAPP_TIMEOUT: "30"
          ROAPP_MAX_RETRIES: "2"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_data_quality_v22_readonly.py
      - name: Canonical READ-ONLY entity audit
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_ENTITY_AUDIT_OUTPUT: marsel-unified-entity-audit.json
          ROAPP_TIMEOUT: "30"
          ROAPP_MAX_RETRIES: "2"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_entity_audit_v20_35.py
      - name: Canonical READ-ONLY product collision review
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_COLLISION_OUTPUT: marsel-unified-product-collisions.json
          ROAPP_TIMEOUT: "30"
          ROAPP_MAX_RETRIES: "2"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_product_code_collision_audit_v22_3.py
      - name: Canonical READ-ONLY warehouse contract audit
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          WAREHOUSE_DIAGNOSTIC_OUTPUT: marsel-unified-warehouse-contract.json
          ROAPP_TIMEOUT: "30"
          ROAPP_MAX_RETRIES: "2"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_warehouse_contract_v20_48.py
      - name: Build PR-safe incomplete evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          json.dump(
              {
                  'system': 'MARSEL Unified Control Plane',
                  'status': 'PR_SAFE_REVIEW',
                  'observed_at': datetime.now(timezone.utc).isoformat(),
                  'source': 'github-actions:MARSEL Unified Control Plane',
                  'readonly': True,
                  'write_requests_made': 0,
                  'ro_app_data_mutated': False,
                  'reason': 'Live RO App audit is skipped for pull_request events to prevent secret exposure.'
              },
              open('marsel-unified-evidence.json', 'w', encoding='utf-8'),
              ensure_ascii=False,
              indent=2,
          )
          PY
      - name: Evaluate unified READ-ONLY safety and quality
        if: github.event_name != 'pull_request'
        id: quality_gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['marsel-unified-api-inventory.json','marsel-unified-data-quality.json','marsel-unified-entity-audit.json','marsel-unified-product-collisions.json','marsel-unified-warehouse-contract.json']
          missing=[x for x in required if not Path(x).exists()]
          if missing: raise SystemExit(f'Missing audit evidence: {missing}')
          inv,dq,ent,col,wh=[json.load(open(x,encoding='utf-8')) for x in required]
          assert inv.get('readonly') is True and inv.get('write_requests_made')==0 and inv.get('ro_app_data_mutated') is False
          assert dq.get('mode')=='READ_ONLY' and dq.get('write_requests_made')==0 and dq.get('ro_app_data_mutated') is False
          assert ent.get('readonly') is True and ent.get('write_requests_made')==0 and ent.get('ro_app_data_mutated') is False
          assert ent.get('safety',{}).get('identifiers_guessed') is False
          assert col.get('mode')=='READ_ONLY' and col.get('write_requests_made')==0 and col.get('ro_app_data_mutated') is False
          assert wh.get('mode')=='READ_ONLY' and wh.get('readonly') is True and wh.get('write_requests_made')==0 and wh.get('ro_app_data_mutated') is False
          quality='PASS' if not dq.get('access_failures') and not dq.get('hard_issues') else 'REVIEW_REQUIRED'
          blocked=[x for x in ent.get('blocked_entities',[]) if x.get('entity')!='warehouse']; failed=[x for x in ent.get('failed_entities',[]) if x.get('entity')!='warehouse']
          entity='PASS' if not blocked and not failed else 'REVIEW_REQUIRED'
          real_collisions=int(col.get('real_collision_group_count') or 0); unresolved=int(col.get('unresolved_group_count') or 0)
          collision='PASS' if not col.get('error') and real_collisions==0 and unresolved==0 else 'REVIEW_REQUIRED'
          warehouse='PASS' if wh.get('result')=='PASS' and wh.get('warehouse_list_contract_verified') is True else 'REVIEW_REQUIRED'
          final='PASS' if all(x=='PASS' for x in (quality,entity,collision,warehouse)) else 'REVIEW_REQUIRED'
          print(f'DATA_QUALITY_RESULT={quality}'); print(f'ENTITY_AUDIT_RESULT={entity}'); print(f'COLLISION_REVIEW_RESULT={collision}'); print(f'WAREHOUSE_CONTRACT_RESULT={warehouse}'); print(f'UNIFIED_RESULT={final}'); print(f'REAL_COLLISION_GROUP_COUNT={real_collisions}'); print(f'UNRESOLVED_GROUP_COUNT={unresolved}')
          if final!='PASS': raise SystemExit('Unified quality gate requires review')
          PY
      - name: Build unified evidence with failure provenance
        if: always() && github.event_name != 'pull_request'
        id: evidence_build
        shell: bash
        env:
          QUALITY_GATE_OUTCOME: ${{ steps.quality_gate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          files = [
              'marsel-unified-api-inventory.json',
              'marsel-unified-data-quality.json',
              'marsel-unified-entity-audit.json',
              'marsel-unified-product-collisions.json',
              'marsel-unified-warehouse-contract.json',
          ]
          missing = [x for x in files if not Path(x).exists()]
          out = {
              'system': 'MARSEL Unified Control Plane',
              'status': 'INCOMPLETE',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'source': 'github-actions:MARSEL Unified Control Plane',
              'readonly': True,
              'write_requests_made': 0,
              'ro_app_data_mutated': False,
              'missing_evidence': missing,
              'quality_gate_outcome': os.environ.get('QUALITY_GATE_OUTCOME', 'unknown'),
          }
          quality_gate_outcome = os.environ.get('QUALITY_GATE_OUTCOME', 'unknown')

          if not missing:
              inv, dq, ent, col, wh = [json.load(open(x, encoding='utf-8')) for x in files]
              quality = 'PASS' if not dq.get('access_failures') and not dq.get('hard_issues') else 'REVIEW_REQUIRED'
              blocked = [x for x in ent.get('blocked_entities', []) if x.get('entity') != 'warehouse']
              failed = [x for x in ent.get('failed_entities', []) if x.get('entity') != 'warehouse']
              entity = 'PASS' if not blocked and not failed else 'REVIEW_REQUIRED'
              real_collisions = int(col.get('real_collision_group_count') or 0)
              unresolved = int(col.get('unresolved_group_count') or 0)
              collision = 'PASS' if not col.get('error') and real_collisions == 0 and unresolved == 0 else 'REVIEW_REQUIRED'
              warehouse = 'PASS' if wh.get('result') == 'PASS' and bool(wh.get('confirmed_live_gets')) else 'REVIEW_REQUIRED'
              final = 'PASS' if all(x == 'PASS' for x in (quality, entity, collision, warehouse)) else 'REVIEW_REQUIRED'
              status = 'INCOMPLETE' if missing else ('PASS' if quality_gate_outcome == 'success' and final == 'PASS' else 'REVIEW_REQUIRED')
              out = {
                  'system': 'MARSEL Unified Control Plane',
                  'status': status,
                  'observed_at': datetime.now(timezone.utc).isoformat(),
                  'source': 'github-actions:MARSEL Unified Control Plane',
                  'readonly': True,
                  'write_requests_made': 0,
                  'ro_app_data_mutated': False,
                  'quality_gate_outcome': quality_gate_outcome,
                  'api_inventory': {'contract_state': inv.get('contract_state', {}), 'summary': inv.get('summary', {}), 'safety': inv.get('safety', {})},
                  'data_quality': {'result': quality, 'summary': dq.get('summary', {}), 'access_failures': dq.get('access_failures', []), 'hard_issues': dq.get('hard_issues', [])},
                  'entity_audit': {'result': entity, 'resolved_entities': ent.get('resolved_entities', []), 'blocked_entities': ent.get('blocked_entities', []), 'failed_entities': ent.get('failed_entities', [])},
                  'product_collision_review': {'result': collision, 'review_only': True, 'duplicate_code_group_count': int(col.get('duplicate_code_group_count') or 0), 'collisions': col.get('collisions', []), 'error': col.get('error')},
                  'warehouse_contract': {'result': warehouse, 'confirmed_live_gets': wh.get('confirmed_live_gets', []), 'explicit_get_contracts': wh.get('explicit_get_contracts', []), 'reference_pages': wh.get('warehouse_reference_pages', [])},
              }

          json.dump(out, open('marsel-unified-evidence.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
      - name: Upload unified evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marsel-unified-evidence
          path: |
            marsel-unified-evidence.json
            marsel-unified-api-inventory.json
            marsel-unified-data-quality.json
            marsel-unified-entity-audit.json
            marsel-unified-product-collisions.json
            marsel-unified-warehouse-contract.json
          if-no-files-found: warn
          retention-days: 90
      - name: Write immutable run marker
        if: always()
        shell: bash
        run: printf '%s\n' "run_id=${GITHUB_RUN_ID}" "sha=${GITHUB_SHA}" "workflow=${GITHUB_WORKFLOW}" "event=${GITHUB_EVENT_NAME}" > marsel-unified-run-marker.txt
      - name: Upload immutable run marker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marsel-unified-run-marker
          path: marsel-unified-run-marker.txt
          if-no-files-found: error
          retention-days: 90
      - name: Enforce unified quality gate result
        if: always() && github.event_name != 'pull_request'
        run: test "${{ steps.quality_gate.outcome }}" = "success"
