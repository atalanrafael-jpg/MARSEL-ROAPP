name: MARSEL Production Gate

on:
  workflow_dispatch:
    inputs:
      unified_control_plane_run_id:
        description: 'Successful Unified Control Plane run ID to use for evidence'
        required: true
        type: string
  workflow_run:
    workflows: ["MARSEL Backup Evidence Producer"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  production-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
      MARSEL_WRITE_APPROVED: "false"
      MARSEL_EVIDENCE_DIR: evidence
      MARSEL_EVIDENCE_INDEX: evidence/evidence-index.json
      BACKUP_PRODUCER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      UNIFIED_CONTROL_PLANE_RUN_ID: ${{ inputs.unified_control_plane_run_id || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify production secret is not exposed in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            -e 'ROAPP_API_KEY[[:space:]]*=[[:space:]]*"[^\"]{12,}"' \
            -e "ROAPP_API_KEY[[:space:]]*=[[:space:]]*'[^']{12,}'" \
            -e 'Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' .; then
            echo 'Credential-like material detected in trusted source.'
            exit 1
          fi

      - name: Verify API key is only supplied by GitHub secret
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROAPP_API_KEY:-}"

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$MARSEL_EVIDENCE_DIR"

      - name: Resolve Unified Control Plane run for automatic gate
        if: github.event_name == 'workflow_run'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          RUN_ID="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&branch=main&per_page=100" \
            | jq -r '.workflow_runs[] | select(.name == "MARSEL Unified Control Plane" and .head_sha == env.HEAD_SHA and .head_branch == "main" and .conclusion == "success") | .id' \
            | head -n 1)"
          test -n "$RUN_ID"
          echo "UNIFIED_CONTROL_PLANE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Resolved successful Unified Control Plane run: $RUN_ID"

      - name: Validate Unified Control Plane run ID
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UNIFIED_CONTROL_PLANE_RUN_ID:-}"
          case "$UNIFIED_CONTROL_PLANE_RUN_ID" in
            *[!0-9]*) echo 'unified_control_plane_run_id must be numeric.'; exit 1 ;;
          esac

      - name: Download unified control-plane evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.UNIFIED_CONTROL_PLANE_RUN_ID }}
          name: marsel-unified-evidence
          path: ${{ env.MARSEL_EVIDENCE_DIR }}
          repository: ${{ github.repository }}
          digest-mismatch: error

      - name: Download backup evidence from backup producer
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.BACKUP_PRODUCER_RUN_ID }}
          name: marsel-backup-evidence
          path: ${{ env.MARSEL_EVIDENCE_DIR }}/backup
          repository: ${{ github.repository }}
          digest-mismatch: error

      - name: Download restore evidence from backup producer
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.BACKUP_PRODUCER_RUN_ID }}
          name: marsel-restore-evidence
          path: ${{ env.MARSEL_EVIDENCE_DIR }}/restore
          repository: ${{ github.repository }}
          digest-mismatch: error

      - name: Promote external backup and restore evidence into gate input
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MARSEL_EVIDENCE_DIR/backup/backup_evidence.json"
          test -f "$MARSEL_EVIDENCE_DIR/restore/restore_evidence.json"
          cp "$MARSEL_EVIDENCE_DIR/backup/backup_evidence.json" "$MARSEL_EVIDENCE_DIR/backup_evidence.json"
          cp "$MARSEL_EVIDENCE_DIR/restore/restore_evidence.json" "$MARSEL_EVIDENCE_DIR/restore_evidence.json"

      - name: Record upstream provenance
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          printf '%s\n' \
            "unified_control_plane_run_id=$UNIFIED_CONTROL_PLANE_RUN_ID" \
            "unified_control_plane_head_sha=${{ github.event.workflow_run.head_sha }}" \
            "backup_producer_run_id=$BACKUP_PRODUCER_RUN_ID" \
            > "$MARSEL_EVIDENCE_DIR/unified-upstream-run.txt"

      - name: Validate evidence inventory (fail-closed)
        shell: bash
        run: python scripts/marsel_evidence_builder_v1.py

      - name: Run fail-closed Issue #19 gate
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        run: python scripts/marsel_production_gate_v1.py

      - name: Explicitly assert no production WRITE authorization
        run: |
          test "${MARSEL_WRITE_APPROVED:-false}" = "false"
          echo 'PRODUCTION_WRITE_AUTHORIZED=false'
