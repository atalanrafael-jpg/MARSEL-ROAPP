name: MARSEL Backup Evidence Producer

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MARSEL Unified Control Plane"]
    types: [completed]
    branches: [main]

concurrency:
  group: marsel-backup-evidence-producer-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  backup-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Block raw backup export from a public repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then

echo "::error::Full RO App backup contains business/customer records. The canonical repository is public; export and artifact upload are blocked until an approved private backup destination is configured."
            echo "::error::Full RO App backup contains business/customer records. The repository is public; export and artifact upload are blocked until an approved private backup destination is configured."
            echo "BACKUP_EXPORT_BLOCKED=PUBLIC_REPOSITORY"
            exit 2
          fi
          echo "BACKUP_DESTINATION_REPOSITORY_PRIVATE=true"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input "httpx==0.28.1"

      - name: Download canonical API inventory
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: marsel-unified-evidence
          path: evidence/upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -f evidence/upstream/marsel-unified-api-inventory.json ]; then
            cp evidence/upstream/marsel-unified-api-inventory.json marsel-api-inventory-v20-31.json
          elif [ -f marsel-api-inventory-v20-31.json ]; then
            true
          else
            echo 'Canonical API inventory is required; no fallback or synthetic inventory is allowed.'
            exit 1
          fi

      - name: Verify RO App secret
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
        shell: bash
        run: test -n "$ROAPP_API_KEY"

      - name: Run full READ-ONLY export
        timeout-minutes: 25
        env:
          ROAPP_API_KEY: ${{ secrets.ROAPP_API_KEY }}
          ROAPP_API_BASE: https://api.roapp.io/v2
          MARSEL_INVENTORY_INPUT: marsel-api-inventory-v20-31.json
          MARSEL_FULL_BACKUP_OUTPUT: marsel-full-readonly-backup-v1.json
          ROAPP_WORK_SCHEDULE_DATE_FROM: "2026-01-01"
          ROAPP_WORK_SCHEDULE_DATE_TO: "2026-12-31"
          MARSEL_MAX_PAGES_PER_ENDPOINT: "10000"
          ROAPP_PAGE_SIZE: "50"
          ROAPP_MIN_REQUEST_INTERVAL: "0.34"
        run: python scripts/marsel_full_readonly_backup_v1.py

      - name: Build canonical backup evidence
        env:
          MARSEL_FULL_BACKUP_INPUT: marsel-full-readonly-backup-v1.json
          MARSEL_BACKUP_EVIDENCE_OUTPUT: backup_evidence.json
          MARSEL_EVIDENCE_ENVIRONMENT: staging
        run: python scripts/marsel_backup_evidence_v1.py

      - name: Verify evidence contract and mutation safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backup_evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('status') == 'PASS'
          assert data.get('readonly') is True
          assert data.get('write_requests_made') == 0
          assert data.get('ro_app_data_mutated') is False
          assert data.get('source_system') == 'roapp'
          assert data.get('producer_identity')
          assert data.get('sha256')
          print('BACKUP_EVIDENCE=PASS')
          print('WRITE_REQUESTS_MADE=0')
          print('RO_APP_DATA_MUTATED=False')
          PY

      - name: Upload backup evidence
        uses: actions/upload-artifact@v7
        with:
          name: marsel-backup-evidence
          path: |
            backup_evidence.json
            marsel-full-readonly-backup-v1.json
          if-no-files-found: error
          retention-days: 7

  restore-verification:
    needs: backup-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download backup evidence
        uses: actions/download-artifact@v8
        with:
          name: marsel-backup-evidence
          path: backup

      - name: Verify local backup inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f backup/marsel-full-readonly-backup-v1.json
          test -f backup/backup_evidence.json

      - name: Restore into isolated staging database
        env:
          MARSEL_FULL_BACKUP_INPUT: backup/marsel-full-readonly-backup-v1.json
          MARSEL_BACKUP_EVIDENCE_INPUT: backup/backup_evidence.json
          MARSEL_RESTORE_DB: marsel-restore-staging.sqlite
          MARSEL_RESTORE_EVIDENCE_OUTPUT: restore_evidence.json
        run: python scripts/marsel_restore_verify_v1.py

      - name: Verify restore evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('restore_evidence.json', encoding='utf-8'))
          assert d['status']=='PASS'
          assert d['readonly'] is True
          assert d['write_requests_made']==0
          assert d['ro_app_data_mutated'] is False
          assert d['target_environment']=='isolated-local-staging'
          assert d['restore_result']=='PASS'
          assert d['verification_result']=='PASS'
          assert d['production_write_attempted'] is False
          assert d['restored_records'] >= 0
          assert d['backup_sha256']
          assert d['sha256']
          print('RESTORE_VERIFICATION=PASS')
          print('TARGET_ENVIRONMENT=isolated-local-staging')
          print('PRODUCTION_WRITE_ATTEMPTED=False')
          print('RO_APP_DATA_MUTATED=False')
          print(f"RESTORED_RECORDS={d['restored_records']}")
          PY

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marsel-restore-evidence
          path: |
            restore_evidence.json
            marsel-restore-staging.sqlite
          if-no-files-found: error
          retention-days: 7
